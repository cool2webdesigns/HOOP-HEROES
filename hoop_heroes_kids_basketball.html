<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hoop Heroes - Kids Basketball</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#07111f;color:white}
#game{position:relative;width:100%;height:100%;touch-action:none}canvas{position:absolute;inset:0;width:100%;height:100%}
.hud{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:96%;max-width:900px;display:flex;justify-content:space-between;z-index:2}
.card{background:#07111fd9;border:2px solid #ffffff25;border-radius:16px;padding:8px 15px;text-align:center}.label{font-size:11px;color:#cbd5e1}.score{font-size:30px;font-weight:900}.timer{font-size:24px;font-weight:900}
button{border:0;border-radius:14px;padding:12px 16px;font-weight:900;cursor:pointer}.primary{background:#ffd43b;color:#111}.dark{background:#17263a;color:#fff}
#sound{position:absolute;right:12px;top:70px;border-radius:50%;width:44px;height:44px;padding:0;z-index:3}
.controls{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:96%;display:flex;justify-content:center;gap:10px;z-index:3}
#power{width:min(250px,40vw);accent-color:#ffd43b}
#message{position:absolute;top:25%;left:50%;transform:translateX(-50%);font-size:clamp(38px,9vw,80px);font-weight:1000;text-shadow:0 6px 0 #0008;opacity:0;transition:.15s;z-index:4;pointer-events:none;white-space:nowrap}
#hint{position:absolute;bottom:72px;left:50%;transform:translateX(-50%);background:#0008;padding:7px 12px;border-radius:20px;font-size:12px;z-index:2;text-align:center}
#menu{position:absolute;inset:0;background:linear-gradient(135deg,#07111fee,#0b2448ee);display:flex;align-items:center;justify-content:center;z-index:10}
.panel{width:min(550px,92%);padding:28px;text-align:center;background:#0d1c31f2;border:2px solid #ffffff20;border-radius:28px;box-shadow:0 20px 70px #000b}
.logo{font-size:clamp(42px,10vw,72px);font-weight:1000;line-height:.9}.logo b{color:#ffd43b}.panel p{color:#cbd5e1}.modes{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.modes button{min-width:145px}
.badge{display:inline-block;background:#ffd43b;color:#111;padding:5px 10px;border-radius:99px;font-size:12px;font-weight:900}
</style>
</head>
<body>
<div id="game">
<canvas id="c"></canvas>
<div class="hud">
 <div class="card"><div class="label">PLAYER</div><div class="score" id="ps">0</div></div>
 <div class="card"><div class="label">TIME</div><div class="timer" id="timer">60</div></div>
 <div class="card"><div class="label">COMPUTER</div><div class="score" id="cs">0</div></div>
</div>
<button id="sound" class="dark">🔊</button>
<div id="message">SWISH!</div>
<div id="hint">Drag from the ball toward the hoop, then release!</div>
<div class="controls">
 <button id="reset" class="dark">↻ Restart</button>
 <input id="power" type="range" min="35" max="100" value="72">
 <button id="shoot" class="primary">🏀 SHOOT</button>
</div>
<div id="menu">
 <div class="panel">
  <div class="badge">KIDS BASKETBALL</div>
  <div class="logo">HOOP <b>HEROES</b></div>
  <p>Throw, bounce, score and become the Hoop Hero!</p>
  <div class="modes">
   <button class="primary" data-mode="easy">🤖 Play Easy</button>
   <button class="primary" data-mode="challenge">🔥 Challenge</button>
  </div>
  <p style="font-size:13px">Touch/Mouse: drag the basketball toward the hoop. Keyboard: press SPACE.</p>
 </div>
</div>
</div>

<script>
(()=> {
const canvas=document.getElementById("c"),ctx=canvas.getContext("2d");
const ps=document.getElementById("ps"),cs=document.getElementById("cs"),timer=document.getElementById("timer"),msg=document.getElementById("message");
const power=document.getElementById("power"),menu=document.getElementById("menu");
let W,H,dpr=1,running=false,last=0,mode="easy",timeLeft=60,pScore=0,cScore=0,aiClock=3;
let ball={x:0,y:0,vx:0,vy:0,r:15,active:false,scored:false,life:0},drag=false,ax=0,ay=0;
let audioOn=true,audio;

function resize(){
 dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;
 canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);resetBall();
}
addEventListener("resize",resize);
function floor(){return H*.77}
function hoop(){return{x:W*.83,y:H*.43}}
function resetBall(){ball={x:W*.19,y:floor()-55,vx:0,vy:0,r:Math.max(11,16*Math.min(W/1000,H/700)),active:false,scored:false,life:0};drag=false}
function beep(f=500,d=.08){
 if(!audioOn)return;
 try{audio??=new(AudioContext||webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.stop(audio.currentTime+d)}catch(e){}
}
function speak(t){if(!audioOn||!speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=1.05;u.pitch=1.1;speechSynthesis.speak(u)}
function show(t){msg.textContent=t;msg.style.opacity=1;setTimeout(()=>msg.style.opacity=0,750)}
function shoot(vx,vy){if(ball.active)return;ball.active=true;ball.vx=vx;ball.vy=vy;ball.life=0;ball.scored=false;beep(300,.07)}
function buttonShoot(){
 if(ball.active)return;
 let h=hoop(),dx=h.x-ball.x,dy=h.y-ball.y,m=Math.hypot(dx,dy)||1;
 let speed=550+Number(power.value)*6;shoot(dx/m*speed,dy/m*speed)
}
function aiShot(){
 if(ball.active)return;
 let h=hoop(),dx=h.x-ball.x,dy=h.y-ball.y,m=Math.hypot(dx,dy)||1;
 let speed=700+Math.random()*160;shoot(dx/m*speed,dy/m*speed)
}
function score(n){
 pScore+=n;ps.textContent=pScore;show(n===3?"3 POINTER!":"SWISH!");beep(900,.12);setTimeout(()=>beep(1200,.14),100);speak("Great shot!");
}
function drawPlayer(x,y,body,ballHeld){
 let s=Math.max(.7,Math.min(W/1000,H/700));ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 ctx.fillStyle="#111827";ctx.beginPath();ctx.arc(0,-78,23,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#f2b880";ctx.beginPath();ctx.arc(0,-80,17,0,Math.PI*2);ctx.fill();
 ctx.fillStyle=body;ctx.beginPath();ctx.roundRect(-25,-55,50,62,14);ctx.fill();
 ctx.fillStyle="#111827";ctx.fillRect(-28,7,18,55);ctx.fillRect(10,7,18,55);
 ctx.fillStyle="#fff";ctx.fillRect(-32,60,25,10);ctx.fillRect(7,60,25,10);
 if(ballHeld&&!ball.active){drawMiniBall(28,-3,ball.r)}
 ctx.restore();
}
function drawMiniBall(x,y,r){ctx.fillStyle="#f97316";ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#7c2d12";ctx.lineWidth=2;ctx.stroke()}
function drawBall(){drawMiniBall(ball.x,ball.y,ball.r);ctx.strokeStyle="#7c2d12";ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r*.65,-.8,.8);ctx.stroke()}
function court(){
 let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#071d39");g.addColorStop(.7,"#123a62");g.addColorStop(1,"#07111f");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 let f=floor();ctx.fillStyle="#d98b45";ctx.fillRect(0,f,W,H-f);ctx.strokeStyle="#fff";ctx.lineWidth=3;
 ctx.beginPath();ctx.moveTo(0,f);ctx.lineTo(W,f);ctx.stroke();
 ctx.beginPath();ctx.arc(W*.5,f,75,Math.PI,0);ctx.stroke();
 ctx.beginPath();ctx.arc(W*.83,f,145,Math.PI*.5,Math.PI*1.5);ctx.stroke();
 for(let i=0;i<34;i++){let x=i*W/34+10,y=f-35-(i%3)*13;ctx.fillStyle=i%2?"#ffcf5a":"#7dd3fc";ctx.beginPath();ctx.arc(x,y,9,0,Math.PI*2);ctx.fill();ctx.fillStyle="#17263a";ctx.fillRect(x-11,y+9,22,18)}
 drawPlayer(W*.19,f-12,"#38bdf8",true);drawPlayer(W*.62,f-12,"#f472b6",false);
 let h=hoop();ctx.fillStyle="#dbeafe";ctx.fillRect(h.x+30,h.y-62,8,115);ctx.fillStyle="#fff";ctx.fillRect(h.x+7,h.y-52,70,42);
 ctx.strokeStyle="#ef4444";ctx.lineWidth=4;ctx.strokeRect(h.x+20,h.y-43,35,28);
 ctx.strokeStyle="#ff6b35";ctx.lineWidth=8;ctx.beginPath();ctx.ellipse(h.x,h.y,35,10,0,0,Math.PI*2);ctx.stroke();
 ctx.strokeStyle="#fff";ctx.lineWidth=2;
 for(let i=-25;i<=25;i+=10){ctx.beginPath();ctx.moveTo(h.x+i*.7,h.y+7);ctx.lineTo(h.x+i*.45,h.y+38);ctx.stroke()}
 for(let y=12;y<=38;y+=9){ctx.beginPath();ctx.moveTo(h.x-18,y+h.y);ctx.lineTo(h.x+18,y+h.y);ctx.stroke()}
}
function aimLine(){if(!drag||ball.active)return;ctx.strokeStyle="#ffffff99";ctx.lineWidth=3;ctx.setLineDash([8,8]);ctx.beginPath();ctx.moveTo(ball.x,ball.y);ctx.lineTo(ax,ay);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle="#ffd43b";ctx.beginPath();ctx.arc(ax,ay,7,0,Math.PI*2);ctx.fill()}
function update(dt){
 if(!running)return;
 if(!ball.active){aiClock-=dt;if(aiClock<=0){aiClock=mode==="challenge"?2.8:4.2;if(Math.random()<.72)aiShot()}}
 if(ball.active){
  let oldY=ball.y;ball.vy+=1050*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.life+=dt;
  let fl=floor()-ball.r;
  if(ball.y>fl){ball.y=fl;ball.vy*=-.62;ball.vx*=.84;beep(170,.04);if(Math.abs(ball.vy)<120){resetBall()}}
  if(ball.x<ball.r){ball.x=ball.r;ball.vx*=-.75}if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx*=-.75}
  let h=hoop(),dx=ball.x-h.x,dy=ball.y-h.y;
  if(Math.abs(dx)<45&&Math.abs(dy)<30){
   let a=Math.atan2(dy,dx),nx=Math.cos(a),ny=Math.sin(a),dot=ball.vx*nx+ball.vy*ny;
   if(dot<0){ball.vx-=1.65*dot*nx;ball.vy-=1.65*dot*ny;beep(240,.06)}
  }
  if(!ball.scored&&oldY<h.y&&ball.y>=h.y&&Math.abs(ball.x-h.x)<26&&ball.vy>0){ball.scored=true;score(Math.abs(ball.vx)<180?3:2)}
  if(ball.life>7)resetBall();
 }
 timeLeft-=dt;if(timeLeft<=0){timeLeft=0;running=false;show(pScore>=cScore?"YOU WIN! 🏆":"TRY AGAIN!");speak(pScore>=cScore?"You win!":"Game over!");setTimeout(()=>menu.style.display="flex",1500)}
 timer.textContent=Math.ceil(timeLeft);
}
function loop(t){let dt=Math.min(.035,(t-last)/1000);last=t;court();aimLine();drawBall();update(dt);if(running)requestAnimationFrame(loop)}
function pos(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener("pointerdown",e=>{if(!running||ball.active)return;let p=pos(e);if(Math.hypot(p.x-ball.x,p.y-ball.y)<75){drag=true;ax=p.x;ay=p.y;canvas.setPointerCapture(e.pointerId)}});
canvas.addEventListener("pointermove",e=>{if(drag){let p=pos(e);ax=p.x;ay=p.y}});
canvas.addEventListener("pointerup",e=>{if(!drag)return;let p=pos(e);ax=p.x;ay=p.y;drag=false;let dx=ax-ball.x,dy=ay-ball.y,m=Math.hypot(dx,dy);if(m>25){let speed=420+Number(power.value)*6;shoot(dx/m*speed,dy/m*speed)}});
document.getElementById("shoot").onclick=buttonShoot;
document.getElementById("reset").onclick=()=>{running=true;timeLeft=mode==="challenge"?45:60;pScore=cScore=0;ps.textContent=cs.textContent=0;aiClock=3;resetBall();last=performance.now();requestAnimationFrame(loop)};
document.getElementById("sound").onclick=e=>{audioOn=!audioOn;e.currentTarget.textContent=audioOn?"🔊":"🔇";if(audioOn)beep(700,.08)};
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;menu.style.display="none";running=true;timeLeft=mode==="challenge"?45:60;pScore=cScore=0;ps.textContent=cs.textContent=0;aiClock=3;resetBall();last=performance.now();requestAnimationFrame(loop);speak("Hoop Heroes!")});
addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();buttonShoot()}});
resize();court();drawBall();
})();
</script>
</body>
</html>
